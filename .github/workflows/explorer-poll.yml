name: Explorer poll (plugin relations)

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

concurrency:
  group: explorer-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger worker explorer poll
        run: |
          curl -fsS -X POST \
            -H "x-admin-token: ${{ secrets.ADMIN_TOKEN }}" \
            https://stats.ussego.com/api/admin/explorer-poll
